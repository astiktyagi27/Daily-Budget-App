name: daily_budget
description: "Daily Budget App: a daily spending budget from bank SMS."
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: ^3.13.7

dependencies:
  flutter:
    sdk: flutter
  flutter_riverpod: ^3.4.3
  shared_preferences: ^2.5.6

dev_dependencies:
  crypto: ^3.0.8
  flutter_test:
    sdk: flutter
  integration_test:
    sdk: flutter
  shared_preferences_platform_interface: ^2.4.2
  very_good_analysis: ^11.0.0

flutter:
  uses-material-design: true

  # Font licence texts, registered at startup (DECISIONS D-028).
  assets:
    - assets/fonts/OFL-BricolageGrotesque.txt
    - assets/fonts/OFL-IBMPlexSans.txt

  # Bundled fonts, never downloaded (design system §4.1, D-028).
  fonts:
    - family: Bricolage
      fonts:
        - asset: assets/fonts/BricolageGrotesque-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/BricolageGrotesque-Bold.ttf
          weight: 700
    - family: Plex
      fonts:
        - asset: assets/fonts/IBMPlexSans-Regular.ttf
          weight: 400
        - asset: assets/fonts/IBMPlexSans-Medium.ttf
          weight: 500
        - asset: assets/fonts/IBMPlexSans-SemiBold.ttf
          weight: 600
